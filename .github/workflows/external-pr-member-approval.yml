name: External PR member approval

on:
  pull_request_target:

permissions:
  pull-requests: read

concurrency:
  group: external-pr-member-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  member-approval:
    name: External PR member approval
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWED_HEAD: ${{ github.event.pull_request.head.sha }}
      MEMBER_IDS: ${{ secrets.EXTERNAL_PR_MEMBER_IDS }}
    steps:
      - name: Check membership and approval
        shell: bash
        run: |
          if jq -e '
            .pull_request
            | .user.type == "Bot" and .head.repo.owner.id == .base.repo.owner.id
          ' "$GITHUB_EVENT_PATH" > /dev/null; then
            echo "The pull request was opened by organization automation."
            exit 0
          fi

          # The Actions token cannot see private organization membership.
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "number")' \
            <<<"$MEMBER_IDS" > /dev/null; then
            echo "::error::The organization member roster is missing or invalid."
            exit 1
          fi

          if jq -e --argjson members "$MEMBER_IDS" '
            .pull_request.user.id as $author | $members | index($author) != null
          ' "$GITHUB_EVENT_PATH" > /dev/null; then
            echo "The pull request was opened by an organization member."
            exit 0
          fi

          echo "Checking for a member review of the external pull request."
          pr_endpoint="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          for attempt in {1..21}; do
            current_head=$(gh api "$pr_endpoint" --jq .head.sha)
            if [[ $current_head != "$REVIEWED_HEAD" ]]; then
              echo "::error::The pull request head changed. Check the workflow for the new commit."
              exit 1
            fi

            reviews=$(gh api --paginate --slurp "$pr_endpoint/reviews?per_page=100")
            approvers=$(jq -r --arg head "$REVIEWED_HEAD" --argjson members "$MEMBER_IDS" '
              add
              | map(select(
                  .state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"
                ))
              | group_by(.user.id)
              | map(max_by(.id))
              | .[]
              | select(.state == "APPROVED" and .commit_id == $head and .user.type == "User")
              | .user.id as $reviewer
              | select($members | index($reviewer) != null)
              | .user.login
            ' <<<"$reviews")
            while IFS= read -r reviewer; do
              if [[ -z $reviewer ]]; then
                continue
              fi
              permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$reviewer/permission" --jq .permission)
              case "$permission" in
                admin|maintain|write)
                  current_head=$(gh api "$pr_endpoint" --jq .head.sha)
                  if [[ $current_head == "$REVIEWED_HEAD" ]]; then
                    echo "An organization member approved the current commit."
                    exit 0
                  fi
                  exit 1
                  ;;
              esac
            done <<<"$approvers"

            if (( attempt < 21 )); then
              sleep 30
            fi
          done

          echo "::error::An organization member must approve the current commit. After approval, re-run this check if it has already ended."
          exit 1
