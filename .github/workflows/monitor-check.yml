name: Check display monitor
on:
  pull_request:
    paths: ['monitor/**', '.github/workflows/display-monitor.yml', '.github/workflows/monitor-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s monitor/tests -v
      - run: node --check monitor/browser.cjs
