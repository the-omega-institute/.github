name: Sync organization profile

on:
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['profile/README.md', 'profile/sync.py', '.github/workflows/profile-sync.yml']

permissions:
  contents: read

concurrency:
  group: organization-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate synchronization before writing the profile
        run: python3 -m unittest discover -s profile/tests -v
      - name: Synchronize changed public research with no model calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 profile/sync.py --publish
